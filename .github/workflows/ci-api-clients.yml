name: CI/CD - API Clients

on:
  push:
    branches: [main, develop]
    paths:
      - 'api-clients/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'api-clients/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payetonkawa_clients_test
          POSTGRES_USER: payetonkawa_test
          POSTGRES_PASSWORD: payetonkawa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5673:5672
          - 15673:15672
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api-clients/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: api-clients
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests
        working-directory: api-clients
        env:
          DATABASE_URL: postgresql://payetonkawa_test:payetonkawa_test@localhost:5433/payetonkawa_clients_test
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5673
          SECRET_KEY: test-secret-key
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./api-clients/coverage.xml
          flags: api-clients
          name: api-clients-coverage

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: api-clients
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Run flake8
        working-directory: api-clients
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run black check
        working-directory: api-clients
        run: |
          black --check app tests
      
      - name: Run isort check
        working-directory: api-clients
        run: |
          isort --check-only app tests

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        working-directory: api-clients
        run: |
          docker build -t payetonkawa-api-clients:${{ github.sha }} .
          docker tag payetonkawa-api-clients:${{ github.sha }} payetonkawa-api-clients:latest
      
      - name: Test Docker image
        run: |
          docker run --rm payetonkawa-api-clients:latest python -c "import app; print('OK')"

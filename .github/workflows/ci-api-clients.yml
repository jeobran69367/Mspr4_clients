name: CI/CD - API Clients

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  TESTING: 'true'

jobs:
  # ============================================
  # PR VALIDATION JOBS (only on pull_request)
  # ============================================
  pr-title-check:
    name: 📝 Check PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ============================================
  # CI JOBS (always run)
  # ============================================
  lint:
    name: 🔍 Analyse de code (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install flake8 black isort pylint pytest httpx

      - name: Lint with flake8
        run: |
          cd api-clients
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check code formatting with black
        id: black-check
        run: |
          cd api-clients
          black --check app tests || echo "⚠️  Formatting issues found. Run 'black app tests' locally."
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          cd api-clients
          isort --check-only app tests || echo "⚠️  Import sorting issues found."

      - name: Lint with pylint
        run: |
          cd api-clients
          pylint app --disable=C0111,R0903,W0212 --max-line-length=120 --exit-zero

  test:
    name: 🧪 Tests unitaires et couverture
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx asyncpg

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Create extension for UUID
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d test_db -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

      - name: Set up test environment
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd api-clients
          # Créer un fichier .env.test temporaire
          echo "DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_db" > .env.test
          echo "DEBUG=true" >> .env.test
          echo "SECRET_KEY=test-secret-key-for-github-actions-$(date +%s)" >> .env.test
          
          # Exécuter les migrations
          echo "Running database migrations..."
          alembic upgrade head

      - name: Run tests with coverage
        env:
          TESTING: 'true'
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd api-clients
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=40

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./api-clients/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api-clients/htmlcov/

      - name: Clean up test database
        if: always()
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d test_db -c "DROP SCHEMA public CASCADE;"
          psql -h localhost -U test_user -d test_db -c "CREATE SCHEMA public;"

  security:
    name: 🔒 Analyse de sécurité
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install safety bandit

      - name: Check for vulnerable dependencies with safety
        run: |
          safety check --json || true

      - name: Security scan with bandit
        run: |
          cd api-clients
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f screen

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt

      - name: Verify application can start
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'  # Base de données mémoire pour la vérification
        run: |
          cd api-clients
          python -c "from app.main import app; print('✅ Application imports successfully')"

  # ============================================
  # SUMMARY JOB
  # ============================================
  summary:
    name: ✅ CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Check CI Results
        run: |
          echo "🎉 CI/CD Pipeline Complete!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
          
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All critical jobs passed!"
          else
            echo "❌ Some critical jobs failed"
          fi

      - name: Fail if critical jobs failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
name: CI/CD - API Clients

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  TESTING: 'true'

jobs:
  # ============================================
  # PR VALIDATION JOBS (only on pull_request)
  # ============================================
  pr-title-check:
    name: 📝 Check PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  pr-size-check:
    name: 📊 PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR size
        run: |
          ADDITIONS=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= insertion)' || echo 0)
          DELETIONS=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= deletion)' || echo 0)
          TOTAL=$((ADDITIONS + DELETIONS))
          
          echo "📊 PR Statistics:"
          echo "  Additions: $ADDITIONS"
          echo "  Deletions: $DELETIONS"
          echo "  Total changes: $TOTAL"
          
          if [ $TOTAL -gt 1000 ]; then
            echo "⚠️  Warning: PR is very large (>1000 lines). Consider splitting it."
          fi

  # ============================================
  # CI JOBS (always run)
  # ============================================
  lint:
    name: 🔍 Analyse de code (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          # Installer les outils de linting et testing
          pip install flake8 black isort pylint pytest pytest-cov httpx

      - name: Lint with flake8
        run: |
          cd api-clients
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check code formatting with black
        id: black-check
        run: |
          cd api-clients
          black --check app tests
        continue-on-error: true

      - name: Show black formatting suggestions
        if: steps.black-check.outcome == 'failure'
        run: |
          echo "⚠️  Code formatting issues found by black."
          echo "To fix locally, run:"
          echo "  cd api-clients && black app tests"
          echo ""
          echo "Or commit the changes from the auto-format step below."

      - name: Auto-format with black (for PRs)
        if: github.event_name == 'pull_request' && steps.black-check.outcome == 'failure'
        run: |
          cd api-clients
          black app tests
          echo "✅ Code auto-formatted with black"

      - name: Check import sorting with isort
        run: |
          cd api-clients
          isort --check-only app tests || echo "⚠️  Import sorting issues found. Run 'isort app tests' locally."

      - name: Lint with pylint
        run: |
          cd api-clients
          pylint app --disable=C0111,R0903,W0212 --max-line-length=120 --exit-zero

  test:
  name: 🧪 Tests unitaires et couverture
  runs-on: ubuntu-latest
  needs: lint
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd api-clients
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio httpx
        # Installer le driver async pour SQLite
        pip install aiosqlite

    - name: Run tests with coverage
      env:
        TESTING: 'true'
        DATABASE_URL: 'sqlite+aiosqlite:///./test.db'  # ← Utiliser aiosqlite
      run: |
        cd api-clients
        # Créer un fichier .env.test pour les tests si nécessaire
        echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" > .env.test
        echo "DEBUG=true" >> .env.test
        echo "SECRET_KEY=test-secret-key" >> .env.test
        
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=40

  security:
    name: 🔒 Analyse de sécurité
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install safety bandit

      - name: Check for vulnerable dependencies with safety
        run: |
          safety check --json || true

      - name: Security scan with bandit
        run: |
          cd api-clients
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f screen

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'Service-Clients'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --failOnCVSS 7

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt

      - name: Verify application can start
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite:///./test.db'
        run: |
          cd api-clients
          python -c "from app.main import app; print('✅ Application imports successfully')"

  integration:
    name: 🔗 Tests d'intégration
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          cd api-clients
          alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          cd api-clients
          pytest tests/ -v -m integration || echo "No integration tests found"

  # ============================================
  # SUMMARY JOB
  # ============================================
  summary:
    name: ✅ CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, integration]
    if: always()
    steps:
      - name: Check CI Results
        run: |
          echo "🎉 CI/CD Pipeline Complete!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All critical jobs passed!"
          else
            echo "❌ Some critical jobs failed"
          fi

      - name: Fail if critical jobs failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
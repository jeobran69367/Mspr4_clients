name: CI/CD - API Clients

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  TESTING: 'true'

jobs:
  # ============================================
  # PR VALIDATION JOBS (only on pull_request)
  # ============================================
  pr-title-check:
    name: 📝 Check PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  pr-size-check:
    name: 📊 PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR size
        run: |
          ADDITIONS=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= insertion)' || echo 0)
          DELETIONS=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= deletion)' || echo 0)
          TOTAL=$((ADDITIONS + DELETIONS))
          
          echo "📊 PR Statistics:"
          echo "  Additions: $ADDITIONS"
          echo "  Deletions: $DELETIONS"
          echo "  Total changes: $TOTAL"
          
          if [ $TOTAL -gt 1000 ]; then
            echo "⚠️  Warning: PR is very large (>1000 lines). Consider splitting it."
          fi

  conflict-check:
    name: 🔀 Check for merge conflicts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflicts
        run: |
          # Fetch base branch and handle case where it might not exist
          if git fetch origin ${{ github.base_ref }} 2>/dev/null; then
            # Check if origin base ref exists
            if git rev-parse origin/${{ github.base_ref }} >/dev/null 2>&1; then
              # Get merge base
              MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }} 2>/dev/null || echo "")
              
              if [ -n "$MERGE_BASE" ]; then
                # Check for conflicts
                if git merge-tree $MERGE_BASE origin/${{ github.base_ref }} HEAD | grep -q '<<<<<<<'; then
                  echo "❌ Merge conflicts detected!"
                  exit 1
                else
                  echo "✅ No merge conflicts"
                fi
              else
                echo "ℹ️  Cannot determine merge base - skipping conflict check"
                echo "✅ Assuming no conflicts (new branch)"
              fi
            else
              echo "ℹ️  Base branch does not exist yet - skipping conflict check"
              echo "✅ No conflicts (new repository or branch)"
            fi
          else
            echo "ℹ️  Cannot fetch base branch - skipping conflict check"
            echo "✅ Assuming no conflicts"
          fi

  # ============================================
  # CI JOBS (always run)
  # ============================================
  lint:
    name: 🔍 Analyse de code (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install flake8 black isort pylint
          pip install -r requirements.txt
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-cov httpx
          fi

      - name: Lint with flake8
        run: |
          cd api-clients
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check code formatting with black
        id: black-check
        run: |
          cd api-clients
          black --check app tests || echo "⚠️  Formatting issues found. Run 'black app tests' locally."
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          cd api-clients
          isort --check-only app tests || echo "⚠️  Import sorting issues found."

      - name: Lint with pylint
        run: |
          cd api-clients
          pylint app --disable=C0111,R0903,W0212 --max-line-length=120 --exit-zero

  test:
    name: 🧪 Tests unitaires et couverture
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-cov httpx
          fi

      - name: Setup test database
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite:///./test.db'
        run: |
          cd api-clients
          # Créer les tables de la base de données
          python -c "
import sys
sys.path.append('.')
from app.database import Base, engine
from app.models import *  # Assurez-vous que tous vos modèles sont importés
print('Creating database tables...')
Base.metadata.drop_all(bind=engine)
Base.metadata.create_all(bind=engine)
print('✅ Database tables created')
"

      - name: Run tests with coverage
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite:///./test.db'
        run: |
          cd api-clients
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=40

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./api-clients/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api-clients/htmlcov/

      - name: Clean up test database
        if: always()
        run: |
          cd api-clients
          rm -f test.db

  security:
    name: 🔒 Analyse de sécurité
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install safety bandit

      - name: Check for vulnerable dependencies with safety
        run: |
          safety check --json || true

      - name: Security scan with bandit
        run: |
          cd api-clients
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f screen

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt

      - name: Verify application can start
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite:///./test.db'
        run: |
          cd api-clients
          python -c "from app.main import app; print('✅ Application imports successfully')"

  # ============================================
  # SUMMARY JOB
  # ============================================
  summary:
    name: ✅ CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Check CI Results
        run: |
          echo "🎉 CI/CD Pipeline Complete!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
          
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All critical jobs passed!"
          else
            echo "❌ Some critical jobs failed"
          fi

      - name: Fail if critical jobs failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
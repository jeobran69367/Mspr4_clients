name: CI/CD - API Clients

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  TESTING: 'true'

jobs:
  # ============================================
  # PR VALIDATION JOBS (only on pull_request)
  # ============================================
  pr-title-check:
    name: 📝 Check PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ============================================
  # CI JOBS (always run)
  # ============================================
  lint:
    name: 🔍 Analyse de code (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install flake8 black isort pylint pytest httpx aiosqlite

      - name: Lint with flake8
        run: |
          cd api-clients
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check code formatting with black
        id: black-check
        run: |
          cd api-clients
          black --check app tests || echo "⚠️  Formatting issues found. Run 'black app tests' locally."
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          cd api-clients
          isort --check-only app tests || echo "⚠️  Import sorting issues found."

      - name: Lint with pylint
        run: |
          cd api-clients
          pylint app --disable=C0111,R0903,W0212 --max-line-length=120 --exit-zero

  test:
    name: 🧪 Tests unitaires et couverture
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx aiosqlite

      - name: Create test database tables
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///./test.db'
        run: |
          cd api-clients
          
          # Créer un script Python pour initialiser la base de données
          cat > setup_test_db.py << 'EOF'
import asyncio
import sys
import os

sys.path.append(os.path.dirname(os.path.abspath(__file__)))

from sqlalchemy.ext.asyncio import create_async_engine

# Importer Base et tous les modèles
try:
    from app.database import Base
    from app.models import *  # Importez tous vos modèles
    print("✅ Successfully imported models")
except ImportError as e:
    print(f"❌ Error importing models: {e}")
    sys.exit(1)

async def setup_db():
    db_url = os.getenv("DATABASE_URL", "sqlite+aiosqlite:///./test.db")
    print(f"Setting up database: {db_url}")
    
    engine = create_async_engine(db_url, echo=False)
    
    try:
        async with engine.begin() as conn:
            print("Dropping existing tables...")
            await conn.run_sync(Base.metadata.drop_all)
            print("Creating new tables...")
            await conn.run_sync(Base.metadata.create_all)
        
        print("✅ Database tables created successfully")
    except Exception as e:
        print(f"❌ Error creating tables: {e}")
        raise
    finally:
        await engine.dispose()

if __name__ == "__main__":
    asyncio.run(setup_db())
EOF
          
          # Exécuter le script
          python setup_test_db.py

      - name: Run tests with coverage
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite+aiosqlite:///./test.db'
        run: |
          cd api-clients
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=40

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./api-clients/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api-clients/htmlcov/

      - name: Clean up test database
        if: always()
        run: |
          cd api-clients
          rm -f test.db  # Supprimer le fichier SQLite
          rm -f setup_test_db.py  # Nettoyer le script temporaire

  security:
    name: 🔒 Analyse de sécurité
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt
          pip install safety bandit

      - name: Check for vulnerable dependencies with safety
        run: |
          safety check --json || true

      - name: Security scan with bandit
        run: |
          cd api-clients
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f screen

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api-clients
          pip install -r requirements.txt

      - name: Verify application can start
        run: |
          cd api-clients
          # Utiliser une base de données mémoire pour la vérification
          python -c "
import asyncio
from app.main import app
print('✅ Application imports successfully')

# Vérifier que l'application peut être créée
from fastapi.testclient import TestClient
client = TestClient(app)
print('✅ TestClient created successfully')
"

  # ============================================
  # SUMMARY JOB
  # ============================================
  summary:
    name: ✅ CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Check CI Results
        run: |
          echo "🎉 CI/CD Pipeline Complete!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
          
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All critical jobs passed!"
          else
            echo "❌ Some critical jobs failed"
          fi

      - name: Fail if critical jobs failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
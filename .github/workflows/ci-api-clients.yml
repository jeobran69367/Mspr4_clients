name: CI/CD - API Clients

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
    paths:
      - 'api-clients/**'
      - '.github/workflows/ci-api-clients.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
    paths:
      - 'api-clients/**'
      - '.github/workflows/ci-api-clients.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payetonkawa_clients_test
          POSTGRES_USER: payetonkawa_test
          POSTGRES_PASSWORD: payetonkawa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5673:5672
          - 15673:15672
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api-clients/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: api-clients
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Wait for services
        run: |
          sleep 10
      
      - name: Run tests with coverage
        working-directory: api-clients
        env:
          DATABASE_URL: postgresql://payetonkawa_test:payetonkawa_test@localhost:5433/payetonkawa_clients_test
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5673
          SECRET_KEY: test-secret-key-for-ci-cd
          JWT_SECRET_KEY: test-jwt-secret-key
          DEBUG: "false"
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-report=html --cov-fail-under=40
      
      - name: Check coverage threshold
        working-directory: api-clients
        run: |
          coverage report --fail-under=40
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./api-clients/coverage.xml
          flags: api-clients
          name: api-clients-coverage
          fail_ci_if_error: false
      
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: api-clients/htmlcov/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('api-clients/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      
      - name: Install dependencies
        working-directory: api-clients
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Run flake8 - Critical errors
        working-directory: api-clients
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run flake8 - Style and complexity
        working-directory: api-clients
        run: |
          flake8 app tests --count --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: false
      
      - name: Run black check
        working-directory: api-clients
        run: |
          black --check app tests
      
      - name: Run isort check
        working-directory: api-clients
        run: |
          isort --check-only app tests
      
      - name: Run mypy type checking
        working-directory: api-clients
        run: |
          mypy app --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('api-clients/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-
      
      - name: Install dependencies
        working-directory: api-clients
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit[toml]
      
      - name: Run pip-audit - Check dependencies for vulnerabilities
        working-directory: api-clients
        run: |
          pip-audit --desc --format json > pip-audit-report.json || true
          pip-audit --desc
        continue-on-error: true
      
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pip-audit-security-report
          path: api-clients/pip-audit-report.json
          retention-days: 30
      
      - name: Run Bandit - Security linter
        working-directory: api-clients
        run: |
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f screen
        continue-on-error: true
      
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-security-report
          path: api-clients/bandit-report.json
          retention-days: 30
      
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'PayeTonKawa-Clients'
          path: 'api-clients'
          format: 'HTML'
        continue-on-error: true
      
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: owasp-dependency-check
          path: reports/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Verify Python installation
        working-directory: api-clients
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app; print('✓ Application imports successfully')"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        working-directory: api-clients
        run: |
          docker build -t payetonkawa-api-clients:${{ github.sha }} .
          docker tag payetonkawa-api-clients:${{ github.sha }} payetonkawa-api-clients:latest
      
      - name: Test Docker image
        run: |
          docker run --rm payetonkawa-api-clients:latest python -c "import app; print('✓ Docker image works correctly')"
      
      - name: Verify application structure
        working-directory: api-clients
        run: |
          python -c "
          import os
          import sys
          
          required_dirs = ['app', 'tests', 'migrations']
          required_files = ['requirements.txt', 'Dockerfile', 'alembic.ini']
          
          for dir in required_dirs:
              if not os.path.isdir(dir):
                  print(f'✗ Missing directory: {dir}')
                  sys.exit(1)
              print(f'✓ Directory found: {dir}')
          
          for file in required_files:
              if not os.path.isfile(file):
                  print(f'✗ Missing file: {file}')
                  sys.exit(1)
              print(f'✓ File found: {file}')
          
          print('✓ Build verification successful')
          "
      
      - name: Save Docker image (for potential deployment)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          docker save payetonkawa-api-clients:latest | gzip > api-clients-image.tar.gz
      
      - name: Upload Docker image artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v3
        with:
          name: docker-image-${{ github.sha }}
          path: api-clients-image.tar.gz
          retention-days: 7
  
  summary:
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    
    steps:
      - name: CI/CD Summary
        run: |
          echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status:" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "### Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ **All CI/CD checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some CI/CD checks failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
          fi
